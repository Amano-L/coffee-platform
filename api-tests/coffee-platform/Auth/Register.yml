info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}{{apiPrefix}}/auth/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "amano",
        "password": "123456",
        "phone": "13800138009",
        "email": "coffee@example.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
